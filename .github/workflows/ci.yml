
name: CI - Build Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f Dockerfile
          test -f index.html
          echo "Semua file project tersedia"

      - name: Build Docker image
        run: docker build -t learn-cicd:latest .
