name: CI - Build and Test Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f Dockerfile
          test -f index.html
          echo "Semua file project tersedia"

      - name: Build Docker image
        run: docker build -t learn-cicd:latest .

      - name: Run Docker container
        run: docker run -d --name learn-cicd-test -p 8080:80 learn-cicd:latest

      - name: Integration test
        run: |
          curl --retry 10 \
               --retry-all-errors \
               --retry-delay 2 \
               --fail http://localhost:8080/ \
               | grep -Fq '<h1>Halo, CI/CD!</h1>'

          echo "Integration test berhasil!"

      - name: Tag Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker tag learn-cicd:latest fajrihaykal/learn-cicd:latest

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push fajrihaykal/learn-cicd:latest

      - name: Cleanup container
        if: always()
        run: docker rm -f learn-cicd-test || true
